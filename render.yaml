# ==============================================================================
# Render.com Infrastructure Blueprint (100% Free Tier Deployment)
# ==============================================================================
services:
  - type: web
    name: carepulse-healthcare-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_RATE_LIMIT_ENABLED
        value: "true"
      - key: GEMINI_RPM_LIMIT
        value: "15"
      - key: GEMINI_DAILY_QUOTA
        value: "500"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*,http://localhost:5173"
      - key: GEMINI_API_KEY
        sync: false # Prompts you securely in Render dashboard
      - key: JWT_SECRET
        generateValue: true # Generates secure random 256-bit secret automatically
