server:
  port: ${PORT:8080}

spring:
  application:
    name: healthcare-manager
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:application-local.yml"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

  jpa:
    open-in-view: false
    show-sql: false

---
# H2 In-Memory Profile (Default - Zero setup needed for development & testing)
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:healthcaredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

---
# PostgreSQL Profile (For Docker, Production, Railway, Render, Supabase, Neon)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/healthcare_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

---
# Application Custom Settings
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    rate-limit:
      enabled: ${GEMINI_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${GEMINI_RPM_LIMIT:15}
      daily-quota: ${GEMINI_DAILY_QUOTA:500}
      user-hourly-limit: ${GEMINI_USER_HOURLY_LIMIT:10}
  booking:
    hold-duration-minutes: 5
  mail:
    from: ${MAIL_FROM:noreply@healthcare-manager.com}
    enabled: ${MAIL_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*}
